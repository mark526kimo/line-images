<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>語音轉字幕</title>
<meta name="description" content="在手機上離線把語音轉成 SRT 字幕">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="語音轉字幕">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg: #f6f7f8; --card: #ffffff; --text: #16191d; --muted: #667080;
    --line: #e2e5e9; --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #e3f3f1;
    --danger: #b42318; --rec: #d92d20;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1214; --card: #181c1f; --text: #e8eaed; --muted: #98a1ad;
      --line: #2a3035; --accent: #2bb3a3; --accent-ink: #06201d; --accent-soft: #15302d;
      --danger: #f97066; --rec: #f97066;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  h1 { font-size: 22px; margin: 4px 0 0; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button, .btn {
    appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 12px; padding: 13px 14px; font: inherit; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button:disabled { opacity: .45; cursor: default; }
  button.rec-on { background: var(--rec); border-color: var(--rec); color: #fff; }
  .file-name { font-size: 14px; color: var(--muted); word-break: break-all; min-height: 1.5em; }
  label.field { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
  select, input[type=number] {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px; width: 100%; min-height: 44px;
  }
  .check { display: flex; align-items: center; gap: 8px; font-size: 15px; align-self: end; min-height: 44px; }
  .check input { width: 20px; height: 20px; accent-color: var(--accent); }
  .hint { font-size: 13px; color: var(--muted); margin: 0; }
  progress { width: 100%; height: 10px; accent-color: var(--accent); }
  #status { font-size: 14px; color: var(--muted); min-height: 1.5em; }
  #status.error { color: var(--danger); }
  #live { max-height: 180px; overflow-y: auto; font-size: 14px; display: grid; gap: 4px; }
  #live:empty { display: none; }
  #live div { padding: 6px 8px; background: var(--accent-soft); border-radius: 8px; }
  #live time { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
  textarea {
    width: 100%; min-height: 220px; font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace;
    color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>語音轉字幕</h1>
    <p class="sub">在手機上離線辨識，產生 SRT 字幕。檔案不會上傳。</p>
  </header>

  <section class="card">
    <div class="row">
      <label class="btn" for="file">選擇檔案</label>
      <button id="recBtn" type="button">● 錄音</button>
    </div>
    <input id="file" type="file" accept="audio/*,video/*" hidden>
    <div class="file-name" id="fileName">尚未選擇音訊或影片</div>
  </section>

  <section class="card">
    <div class="row">
      <label class="field">模型
        <select id="model">
          <option value="onnx-community/whisper-tiny">tiny・最快</option>
          <option value="onnx-community/whisper-base" selected>base・建議</option>
          <option value="onnx-community/whisper-small">small・較準</option>
        </select>
      </label>
      <label class="field">語言
        <select id="lang">
          <option value="zh" selected>中文</option>
          <option value="en">英文</option>
          <option value="ja">日文</option>
          <option value="ko">韓文</option>
          <option value="">自動偵測</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label class="field">每行字數上限
        <input id="maxChars" type="number" min="0" max="100" value="16" inputmode="numeric">
      </label>
      <label class="check"><input id="trad" type="checkbox" checked>轉繁體</label>
    </div>
    <p class="hint">第一次使用會下載模型（tiny 約 40 MB、base 約 80 MB、small 約 250 MB），之後存在手機裡可離線使用，建議連 Wi‑Fi。字數上限填 0 為不切行。</p>
  </section>

  <section class="card">
    <div class="row">
      <button id="startBtn" class="primary" type="button" disabled>開始轉換</button>
      <button id="stopBtn" type="button" disabled>取消</button>
    </div>
    <progress id="bar" max="1" value="0" hidden></progress>
    <div id="status"></div>
    <div id="live"></div>
  </section>

  <section class="card" id="resultCard" hidden>
    <strong>字幕結果（可直接修改）</strong>
    <textarea id="srt" spellcheck="false"></textarea>
    <div class="row">
      <button id="dlBtn" class="primary" type="button">下載 SRT</button>
      <button id="shareBtn" type="button">分享</button>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/cn2t.js"></script>
<script type="text/plain" id="workerSrc">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.6';
env.allowLocalModels = false;

const SR = 16000;
let asr = null, loadedKey = null;

async function hasWebGPU() {
  try { return !!(navigator.gpu && await navigator.gpu.requestAdapter()); } catch { return false; }
}

async function load(model) {
  const device = (await hasWebGPU()) ? 'webgpu' : 'wasm';
  const key = model + '|' + device;
  if (asr && loadedKey === key) return;
  const progress_callback = (p) => {
    if (p.status === 'progress' && p.total) postMessage({ type: 'download', file: p.file, loaded: p.loaded, total: p.total });
  };
  const dtype = device === 'webgpu' ? { encoder_model: 'fp32', decoder_model_merged: 'q4' } : 'q8';
  try {
    asr = await pipeline('automatic-speech-recognition', model, { device, dtype, progress_callback });
  } catch (e) {
    if (device !== 'webgpu') throw e;
    asr = await pipeline('automatic-speech-recognition', model, { device: 'wasm', dtype: 'q8', progress_callback });
  }
  loadedKey = key;
}

// 把音訊切成不超過 29 秒的片段，切點挑最後幾秒裡最安靜的地方，避免把字切斷
function windows(audio) {
  const maxLen = 29 * SR, search = 6 * SR, frame = SR / 10;
  const out = [];
  let start = 0;
  while (start < audio.length) {
    if (audio.length - start <= maxLen) { out.push([start, audio.length]); break; }
    let best = start + maxLen, bestE = Infinity;
    for (let f = start + maxLen - search; f + frame <= start + maxLen; f += frame) {
      let e = 0;
      for (let i = f; i < f + frame; i++) e += audio[i] * audio[i];
      if (e < bestE) { bestE = e; best = f + frame / 2; }
    }
    out.push([start, best]);
    start = best;
  }
  return out;
}

self.onmessage = async ({ data }) => {
  try {
    postMessage({ type: 'status', text: '載入模型中…' });
    await load(data.model);
    const audio = data.audio;
    const wins = windows(audio);
    const total = audio.length / SR;
    postMessage({ type: 'status', text: '辨識中…' });
    for (const [s, e] of wins) {
      const offset = s / SR, end = e / SR;
      const opts = { return_timestamps: true, task: 'transcribe' };
      if (data.language) opts.language = data.language;
      const res = await asr(audio.subarray(s, e), opts);
      for (const c of res.chunks || []) {
        const text = (c.text || '').trim();
        if (!text) continue;
        const a = Math.min(offset + (c.timestamp[0] ?? 0), end);
        const b = Math.min(c.timestamp[1] == null ? end : offset + c.timestamp[1], end);
        postMessage({ type: 'segment', start: a, end: Math.max(b, a + 0.3), text });
      }
      postMessage({ type: 'progress', value: end / total });
    }
    postMessage({ type: 'done' });
  } catch (err) {
    postMessage({ type: 'error', text: String(err && err.message || err) });
  }
};
</script>
<script>
const $ = (id) => document.getElementById(id);
const SR = 16000;
let currentFile = null, segments = [], worker = null, wakeLock = null;

// ---------- SRT ----------
function ts(sec) {
  let ms = Math.round(sec * 1000);
  const h = Math.floor(ms / 3600000); ms -= h * 3600000;
  const m = Math.floor(ms / 60000); ms -= m * 60000;
  const s = Math.floor(ms / 1000); ms -= s * 1000;
  const p = (n, w = 2) => String(n).padStart(w, '0');
  return `${p(h)}:${p(m)}:${p(s)},${p(ms, 3)}`;
}

// 過長的字幕平均拆成多行，時間按字數比例分配；有空白的語言不切斷單字
function splitLong(text, start, end, maxChars) {
  if (maxChars <= 0 || text.length <= maxChars) return [[start, end, text]];
  const n = Math.ceil(text.length / maxChars);
  const size = Math.ceil(text.length / n);
  let pieces = [];
  if (text.includes(' ')) {
    let cur = '';
    for (const w of text.split(/\s+/)) {
      if (cur && (cur.length >= size || cur.length + 1 + w.length > maxChars)) { pieces.push(cur); cur = w; }
      else cur = cur ? cur + ' ' + w : w;
    }
    pieces.push(cur);
  } else {
    for (let i = 0; i < text.length; i += size) pieces.push(text.slice(i, i + size));
  }
  const total = pieces.reduce((a, p) => a + p.length, 0);
  let t = start;
  return pieces.map((p) => { const d = (end - start) * p.length / total; const r = [t, t + d, p.trim()]; t += d; return r; });
}

let convert = (s) => s;
function setupConverter() {
  convert = (s) => s;
  if ($('trad').checked && window.OpenCC) {
    try { convert = OpenCC.Converter({ from: 'cn', to: 'twp' }); } catch {}
  }
}

function buildSrt() {
  const maxChars = parseInt($('maxChars').value, 10) || 0;
  let i = 1, out = '';
  for (const seg of segments) {
    for (const [a, b, line] of splitLong(seg.text, seg.start, seg.end, maxChars)) {
      if (!line) continue;
      out += `${i++}\n${ts(a)} --> ${ts(b)}\n${line}\n\n`;
    }
  }
  return out;
}

// ---------- 音訊 ----------
async function decodeTo16k(file) {
  const buf = await file.arrayBuffer();
  const Ctx = window.AudioContext || window.webkitAudioContext;
  const ctx = new Ctx();
  let decoded;
  try { decoded = await ctx.decodeAudioData(buf); } finally { ctx.close && ctx.close(); }
  const length = Math.ceil(decoded.duration * SR);
  const off = new OfflineAudioContext(1, length, SR); // 混成單聲道並重新取樣到 16kHz
  const src = off.createBufferSource();
  src.buffer = decoded; src.connect(off.destination); src.start();
  const rendered = await off.startRendering();
  return rendered.getChannelData(0);
}

// ---------- 介面 ----------
function setStatus(text, isError = false) { $('status').textContent = text; $('status').classList.toggle('error', isError); }
function setFile(file) {
  currentFile = file;
  $('fileName').textContent = file ? `${file.name}（${(file.size / 1048576).toFixed(1)} MB）` : '尚未選擇音訊或影片';
  $('startBtn').disabled = !file;
}
function setRunning(on) {
  $('startBtn').disabled = on || !currentFile;
  $('stopBtn').disabled = !on;
  $('recBtn').disabled = on;
  $('bar').hidden = !on;
}

$('file').addEventListener('change', (e) => setFile(e.target.files[0] || null));

// 錄音
let recorder = null, recChunks = [];
$('recBtn').addEventListener('click', async () => {
  if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(stream);
    recChunks = [];
    recorder.ondataavailable = (e) => e.data.size && recChunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      const type = recorder.mimeType || 'audio/webm';
      const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
      const stamp = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '');
      setFile(new File(recChunks, `錄音-${stamp}.${ext}`, { type }));
      $('recBtn').textContent = '● 錄音'; $('recBtn').classList.remove('rec-on');
    };
    recorder.start();
    $('recBtn').textContent = '■ 停止錄音'; $('recBtn').classList.add('rec-on');
  } catch (e) {
    setStatus('無法使用麥克風：' + e.message, true);
  }
});

async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch {}
}

function finish(msg, isError = false) {
  setRunning(false);
  keepAwake(false);
  if (worker) { worker.terminate(); worker = null; }
  setStatus(msg, isError);
  if (segments.length) { $('srt').value = buildSrt(); $('resultCard').hidden = false; }
}

$('startBtn').addEventListener('click', async () => {
  if (!currentFile) return;
  segments = []; $('live').innerHTML = ''; $('resultCard').hidden = true; $('bar').value = 0;
  setRunning(true); keepAwake(true); setupConverter();
  setStatus('讀取音訊中…');
  let audio;
  try { audio = await decodeTo16k(currentFile); }
  catch (e) { finish('無法讀取這個檔案的聲音，請換成 mp3、m4a、wav 或 mp4。', true); return; }

  const blob = new Blob([$('workerSrc').textContent], { type: 'text/javascript' });
  worker = new Worker(URL.createObjectURL(blob), { type: 'module' });
  worker.onmessage = ({ data }) => {
    if (data.type === 'status') setStatus(data.text);
    else if (data.type === 'download') {
      $('bar').value = data.loaded / data.total;
      setStatus(`下載模型 ${data.file.split('/').pop()}：${(data.loaded / 1048576).toFixed(0)} / ${(data.total / 1048576).toFixed(0)} MB`);
    } else if (data.type === 'progress') {
      $('bar').value = data.value;
      setStatus(`辨識中… ${Math.round(data.value * 100)}%`);
    } else if (data.type === 'segment') {
      const seg = { start: data.start, end: data.end, text: convert(data.text) };
      segments.push(seg);
      const div = document.createElement('div');
      const t = document.createElement('time'); t.textContent = ts(seg.start).slice(0, 8);
      div.append(t, seg.text);
      $('live').append(div); $('live').scrollTop = $('live').scrollHeight;
    } else if (data.type === 'done') finish(segments.length ? `完成！共 ${segments.length} 段。` : '完成，但沒有辨識到語音。');
    else if (data.type === 'error') finish('發生錯誤：' + data.text, true);
  };
  worker.onerror = (e) => finish('發生錯誤：' + (e.message || '無法啟動辨識'), true);
  worker.postMessage({ audio, model: $('model').value, language: $('lang').value }, [audio.buffer]);
});

$('stopBtn').addEventListener('click', () => finish('已取消。'));

function srtFile() {
  const base = currentFile ? currentFile.name.replace(/\.[^.]+$/, '') : 'subtitle';
  return new File([$('srt').value], base + '.srt', { type: 'application/x-subrip' });
}
$('dlBtn').addEventListener('click', () => {
  const f = srtFile();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(f); a.download = f.name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
});
$('shareBtn').addEventListener('click', async () => {
  const f = srtFile();
  try {
    if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f], title: f.name });
    else await navigator.share({ title: f.name, text: $('srt').value });
  } catch (e) {
    if (e.name !== 'AbortError') setStatus('這個瀏覽器不支援分享，請改用下載。', true);
  }
});
if (!navigator.share) $('shareBtn').hidden = true;

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
